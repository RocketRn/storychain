name: CI

on:
  push:
  pull_request:

# one run per ref: a newer push cancels the older run
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # the pnpm version comes from "packageManager" in package.json
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # a development build of React in the bundle is ~2x larger and several times slower (see scripts/smoke-single-origin.mjs)
      - run: |
          if grep -rq "Download the React DevTools" apps/web/dist/assets; then
            echo "the web bundle contains React's development build" >&2
            exit 1
          fi
      # production dependencies only: dev-tool advisories without an upstream fix are listed in AUDIT.md
      - run: pnpm audit --prod --audit-level=critical
